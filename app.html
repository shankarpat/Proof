/* ---------- Remind Me: a small rules engine, no AI ---------- */
function remindModules(x,mode){
  const M=[],add=(key,w,html)=>{if(w>0)M.push({key,w,html})};
  const recentN=x.days.filter(i=>x.today-i<60).length;
  const away=x.daysSinceLast!=null&&x.daysSinceLast>=3;
  if(mode==="hard"){
    const small=x.tiny.length?pickOne(x.tiny):x.comps.length?[...x.comps].sort((a,b)=>(a.t.tiny||a.t.title).length-(b.t.tiny||b.t.title).length)[Math.floor(Math.random()*Math.min(3,x.comps.length))]:null;
    if(small)add("small:"+small.key,9,`<p class="kick">Remember ${fmtDate(small.at)}?</p><p>Your promise was just:</p><q>${esc(small.tiny&&small.t.tiny?small.t.tiny:small.t.title)}</q><p>You did it.</p><p class="pause">That counted then. It counts now.</p>`);
    if(x.rests.length)add("rest",6,`<h2>You've let rest count ${times(x.rests.length)}.</h2><p>Resting was never giving up. It was taking care of the person who keeps showing up.</p>`);
    if(x.comebacks)add("cb-soft",6,`<h2>You've been here before.</h2><p>And you came back ${times(x.comebacks)}.</p><p class="pause">There's no rush this time either.</p>`);
    const w=pickOne(x.wins);if(w)add("win:"+w.id,5,`<p class="kick">On ${fmtDate(w.at)}, you were proud of this:</p><q>${esc(w.text)}</q>`);
    if(x.total&&x.total<25)add("few",4,`<h2>${x.total} times, you kept a promise to yourself.</h2><p>None of them needed to be big. They all still count.</p>`);
    return M;
  }
  if(away&&x.comebacks)add("away",9,`<h2>It's been ${x.daysSinceLast} days.</h2><p>You've been away before, and every time, you came back.</p><p class="pause">That return becomes part of your story too.</p>`);
  if(x.total>=10)add("total",x.total>=100?6:4,`<p class="kick">Look at your sky.</p><div class="big">${x.total}</div><p>promises kept.</p><p class="pause">That's ${x.total} moments where you could have done something else, and chose to show up. They're still here.</p>`);
  if(x.total>0&&x.total<10)add("early",7,`<h2>You don't need hundreds of stars for them to matter.</h2><p>You've shown up for yourself ${times(x.total)}.</p><p class="pause">Those moments are real. Let's make it ${x.total+1}.</p>`);
  const bp=pickOne(x.byP.filter(y=>y.n>=2&&y.p.belief).slice(0,3));
  if(bp)add("p:"+bp.p.id,6,`<p class="kick">You said you're someone who</p><h2>${esc(bp.p.belief)}.</h2><p>You've kept that promise ${times(bp.n)}.</p>`);
  const bt=pickOne(x.byTask.filter(y=>y.n>=2).slice(0,4));
  if(bt)add("t:"+bt.t.id,4,`<p class="kick">You said this mattered to you:</p><q>${esc(bt.t.title)}</q><p>You've done it ${times(bt.n)}.</p>`);
  if(x.longest&&x.longest.g>=3)add("longest",away?7:5,`<h2>You once went ${x.longest.g} days without checking anything off.</h2><p class="pause">Then, on ${fmtDate(x.longest.ret)}, you came back.</p>`);
  if(x.comebacks>=2&&!away)add("cbcount",4,`<h2>You've come back ${times(x.comebacks)}.</h2><p>You can always come back again.</p>`);
  const n=pickOne(x.notes);if(n)add("note:"+n.key,6,`<p class="kick">On ${fmtDate(n.at)}, after “${esc(n.t.title)}”, you wrote:</p><q>${esc(n.note)}</q>`);
  const w=pickOne(x.wins);if(w)add("win:"+w.id,6,`<p class="kick">On ${fmtDate(w.at)}, you were proud of this:</p><q>${esc(w.text)}</q>`);
  const cp=pickOne(x.proved);if(cp)add("cp:"+cp.id,4,`<p class="kick">You once wrote what you'd proved to yourself:</p><q>${esc(cp.proved)}</q>`);
  const ms=pickOne(x.msWon);if(ms){const k=ms.attempts.length;add("ms:"+ms.id,6,`<p class="kick">Milestone reached</p><h2>${esc(ms.title)}</h2><p>${k>1?`It took ${k} attempts, and you never stopped trying.`:"You said you would, and you did."}</p>`)}
  if(x.retries)add("retry",4,`<h2>${x.retries===1?"Once":x.retries+" times"}, a goal didn't happen on time.</h2><p>And you chose a new date instead of quitting.</p>`);
  if(recentN>=10&&!away)add("recent",3,`<h2>Sometimes progress becomes so normal you stop noticing it.</h2><p>You've shown up on ${recentN} of the last 60 days.</p><p class="pause">Take a second and look at what you've built.</p>`);
  if(x.first&&x.today-dIdx(x.first.at)>=14)add("first",3,`<p class="kick">Your very first star</p><h2>${fmtDate(x.first.at)}</h2><q>${esc(x.first.t.title)}</q><p>Look at everything that came after it.</p>`);
  const ya=x.comps.filter(c=>{const d=x.today-dIdx(c.at);return d>=355&&d<=375});
  if(ya.length)add("yearago",6,`<p class="kick">A year ago</p><h2>You were already trying.</h2><p>${esc([...new Set(ya.map(c=>c.t.title))].slice(0,3).join(", "))}.</p><p class="pause">Look how far you've come since.</p>`);
  if(x.tiny.length)add("tiny",3,`<h2>${x.tiny.length===1?"Once":x.tiny.length+" times"}, you did the tiny version on a low day.</h2><p>Those stars shine exactly as bright.</p>`);
  const pair=storyPhotos();if(pair)add("photo:"+pair[0].id,4,`<p class="kick">Then and now</p>${photoPairHTML(pair)}<p>${plural(dIdx(parseYmd(pair[1].date))-dIdx(parseYmd(pair[0].date)),"day")} between these.</p>`);
  return M;
}
function buildRemind(mode){

  slides.push({stars:1,html:mode==="hard"
    ?`<h2>Just one small thing, or nothing at all.</h2><p>Both are allowed today.</p><div class="row"><button class="btn" data-act="story-smaller">Make today's promise smaller</button><button class="btn ghost" data-act="story-close">Close</button></div>${photoToggle}`
    :`<h2>${x.total?`You've already given yourself ${x.total} ${x.total===1?"reason":"reasons"} to believe you can show up again.`:"You've already shown yourself you can."}</h2><p class="pause">You don't have to fix everything today. Just make one small promise.</p><div class="row"><button class="btn" data-act="story-promise">Make a small promise</button><button class="btn ghost" data-act="story-close">Close</button></div>${photoToggle}`});
  return {slides,used};
}
function openRemind(start){

/* ---------- Year in Proof ---------- */

  const top=x.byTask[0];if(top&&top.n>=2)slides.push({stars:.65,html:`<p class="kick">The promise you kept most</p><q>${esc(top.t.title)}</q><p>${times(top.n)[0].toUpperCase()+times(top.n).slice(1)}.</p>`});
  const small=x.tiny.length?x.tiny[0]:x.comps.length>2?[...x.comps].sort((m,n)=>m.t.title.length-n.t.title.length)[0]:null;

let confRAF=null;
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio,x=c.getContext("2d");
  const cols=[...COLORS,"#FFFFFF"],parts=Array.from({length:160},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*3*devicePixelRatio,vy:(2+Math.random()*4)*devicePixelRatio,r:(3+Math.random()*5)*devicePixelRatio,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)],s:Math.random()<.4}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);const age=t-t0;
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,1-(age-2600)/1400);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
      if(p.s){x.beginPath();for(let i=0;i<8;i++){const R=i%2?p.r*.35:p.r*1.3;x.lineTo(Math.sin(i*Math.PI/4)*R,-Math.cos(i*Math.PI/4)*R)}x.fill()}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(age<4000)confRAF=requestAnimationFrame(f);else stopConfetti()})(t0);
}
function stopConfetti(){cancelAnimationFrame(confRAF);$("#confetti")?.remove()}

  if(act==="delpcat"){delete S.photoPrivacy[id];S.photoCats=S.photoCats.filter(c=>c.id!==id);S.photos.forEach(ph=>{if(ph.cat===id)ph.cat=null});if(photoFilter===id)photoFilter="all";persist();render();return}
  if(act==="editphoto"){editingPhoto=id;viewPhoto(id);return}
  if(act==="canceleditphoto"){editingPhoto=null;viewPhoto(id);return}
  if(act==="photo"){
    const tp=S.photos.find(p=>p.id===id);
    if(tp&&isHiddenPh(tp)){openUnlock(()=>{if(!comparing&&!organizing){editingPhoto=null;viewPhoto(id)}});return}
    if(comparing){compareSel=compareSel.includes(id)?compareSel.filter(x=>x!==id):[...compareSel,id].slice(-2);render()}
    else if(organizing){orgSel=orgSel.includes(id)?orgSel.filter(x=>x!==id):[...orgSel,id];render()}
    else{editingPhoto=null;viewPhoto(id)}return}
  if(act==="delphoto"){
    if(!confirm("Delete this photo for good? This can't be undone."))return;
    await deletePhotos([id]);closeModal();render();toast("Photo deleted.");return;
  }
  if(act==="bulkdel"){
    const ids=orgSel.filter(x=>S.photos.some(p=>p.id===x));if(!ids.length)return;
    if(!confirm(`Delete ${plural(ids.length,"photo")} for good? This can't be undone.`))return;
    await deletePhotos(ids);orgSel=[];if(!S.photos.length)organizing=false;render();toast(`${plural(ids.length,"photo")} deleted.`);return;
  }
  if(act==="selall"){
    const match=p=>photoFilter==="all"||(photoFilter==="none"?!p.cat||!PC(p.cat):p.cat===photoFilter);
    const ids=S.photos.filter(p=>match(p)&&!isHiddenPh(p)).map(p=>p.id);
    orgSel=ids.every(x=>orgSel.includes(x))?[]:ids;render();return;
  }
  if(act==="delq"){S.myQuotes=S.myQuotes.filter(q=>q.id!==id);persist();render();return}
});

document.addEventListener("focusin",e=>{const f=e.target.closest&&e.target.closest(".addstep");if(f)f.classList.add("open")});
document.addEventListener("change",async e=>{

});

document.addEventListener("submit",async e=>{
  const f=e.target,F=f.elements;e.preventDefault();
  const kind=f.dataset.form;
  if(kind==="addp"||kind==="editp"){
    const title=F.title.value.trim(),belief=F.belief.value.trim().replace(/^i am someone who\s*/i,""),color=F.color.value,cat=F.cat.value||null,constellation=F.constellation.value.trim();
    if(!title)return;
    if(kind==="addp")S.priorities.push({id:rid(),title,belief,color,cat,constellation,created:Date.now()});
    else{const pr=P(f.dataset.id),changed=constellation&&constellation!==pr.constellation;Object.assign(pr,{title,belief,color,cat,constellation});
      if(changed){const n=S.tasks.filter(t=>t.pid===pr.id).reduce((a,t)=>a+t.log.length,0);if(n>=2){conAnim=pr.id;addingP=false;editingP=null;persist();render();showSky();toast(`Say hello to ${constellation}.`);return}toast(`${constellation} will appear in your sky as its stars grow.`)}}
    addingP=false;editingP=null;persist();render();return;
  }
  if(kind==="addtask"){
    const v=F.t.value.trim();if(!v){F.t.focus();return}
    const t={id:rid(),pid:f.dataset.pid,title:v,kind:"regular",freq:readFreq(f),tiny:F.tiny.value.trim(),log:[],todayOn:null,created:Date.now()};
    S.tasks.push(t);persist();render();
    const nf=document.querySelector(`[data-form="addtask"][data-pid="${f.dataset.pid}"]`);if(nf){nf.classList.add("open");nf.elements.t.focus()}
    toast(`Added: ${t.freq.type==="days"?"on "+freqLabel(t):freqLabel(t).toLowerCase()}${t.tiny?", with a tiny version":""}.`);return;
  }
  if(kind==="addcat"){const n=F.n.value.trim();if(!n)return;S.categories.push({id:rid(),name:n});persist();render();document.querySelector('[data-form="addcat"] input')?.focus();return}
  if(kind==="checkpoint"){
    const last=S.checkpoints[S.checkpoints.length-1],since=last?last.date:0;
    const kept=allCompletions().filter(c=>c.at>since);
    S.checkpoints.push({id:rid(),date:Date.now(),count:kept.length,items:kept.map(c=>({tid:c.t.id,at:c.at})),proved:F.proved.value.trim(),hard:F.hard.value.trim(),forward:F.forward.value.trim()});
    reflectSec="past";persist();render();toast("Checkpoint saved. You showed up for this, too.");return;
  }
  if(kind==="addms"||kind==="editms"){
    const d={title:F.title.value.trim(),why:F.why.value.trim(),date:F.date.value,pid:F.pid.value||null};
    if(!d.title||!d.date)return;
    if(kind==="addms")S.milestones.push({id:rid(),...d,status:"active",attempts:[],created:Date.now()});
    else Object.assign(M(f.dataset.id),d);
    msAdding=false;msEditing=null;persist();render();
    toast(kind==="addms"?`Milestone set for ${fmtYmd(d.date)}. You've got this.`:"Milestone saved.");return;
  }
  if(kind==="retry"){
    const m=M(f.dataset.id);if(!F.date.value)return;
    const wasDue=dueMs(m);
    m.attempts.push({due:m.date,outcome:"retry",at:Date.now(),note:F.note.value.trim()});
    m.date=F.date.value;retryFor=null;persist();render();
    toast(wasDue?`Not given up, just re-aimed. Attempt ${m.attempts.length+1} starts now.`:`New date set: ${fmtYmd(m.date)}.`);return;
  }
  if(kind==="photo"){
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Saving…";
    const id=rid();
    try{
      const ref=await storePhoto(id,pending.blob);
      const want=F.priv?F.priv.value:"visible";
      const rec={id,date:F.date.value||ymd(),caption:F.caption.value.trim(),cat:pickedCat(F),pid:F.pid.value||null,created:Date.now(),...ref};
      if(want==="blur"||(want==="lock"&&photoLock()))rec.privacy=want;else if(want==="lock")rec.privacy="blur";
      S.photos.push(rec);URL.revokeObjectURL(pending.url);pending=null;persist();render();
      if(want==="lock"&&!photoLock()){pendingPriv={kind:"photo",ids:[id],level:"lock"};openSetPin();toast("Photo added. Create a passcode to lock it. Until then, it's blurred.")}
      else toast(want==="lock"?"Photo added and locked.":"Photo added to your journey.");
    }catch(err){btn.disabled=false;btn.textContent="Add photo";toast(err&&err.code==="quota_exceeded"?"Photo storage is full. Delete a few older photos to make room.":"The photo wasn't saved. Try again in a moment.")}
    return;
  }
  if(kind==="editphoto"){const ph=S.photos.find(p=>p.id===f.dataset.id);Object.assign(ph,{date:F.date.value||ph.date,caption:F.caption.value.trim(),cat:pickedCat(F),pid:F.pid.value||null});editingPhoto=null;persist();render();viewPhoto(ph.id);toast("Photo updated.");return}
  if(kind==="addpcat"){const n=F.n.value.trim();if(!n)return;if(!photoCatsAll().some(c=>c.name.toLowerCase()===n.toLowerCase()))S.photoCats.push({id:rid(),name:n});persist();render();document.querySelector('[data-form="addpcat"] input')?.focus();return}
  if(kind==="orgnew"){const n=F.n.value.trim();if(!n)return;const id=pickedCat({newcat:{value:n}});const k=orgSel.length;S.photos.forEach(ph=>{if(orgSel.includes(ph.id))ph.cat=id});orgSel=[];persist();render();toast(`${plural(k,"photo")} moved to ${PC(id).name}.`);return}
  if(kind==="edittask"){const t=T(f.dataset.id);const title=F.title.value.trim();if(!title)return;t.title=title;t.tiny=F.tiny.value.trim();
    t.freq=readFreq(f);editingTask=null;persist();render();toast(t.tiny?"Tiny version saved. On low days, that's enough.":"Step saved.");return}
  if(kind==="win"){const text=F.text.value.trim();if(!text)return;const before=shownDays().has(dIdx(Date.now()));const w={id:rid(),at:Date.now(),text,pid:F.pid.value||null};S.wins.push(w);bornKey="w"+w.id;if(!before&&isComebackToday())shootNext=true;persist();closeModal();render();showSky();toast("That counts too. A new star is shining.");return}
  if(kind==="letter"){const text=F.text.value.trim();if(!text)return;const cond=F.cond.value;
    if(cond==="date"&&!F.date.value)return;
    S.letters.push({id:rid(),text,created:Date.now(),cond,date:cond==="date"?F.date.value:null,msId:cond==="milestone"?F.msId.value:null,opened:false});
    persist();render();toast("Sealed. Future you will be so glad you wrote this.");return}
  if(kind==="recap"){S.recaps[f.dataset.key]={seen:true,q:F.q.value,answer:F.a.value.trim()};persist();render();toast("Saved. Here's to next week.");return}
  if(kind==="backfill"){const t=T(F.tid.value);const day=+f.dataset.day;if(!t)return;
    if(t.log.some(l=>dIdx(l.at)===day)){toast("That's already counted on this day.");return}
    t.log.push({at:fromIdx(day)+12*3600*1000,note:F.note.value.trim(),late:true});t.log.sort((a,b)=>a.at-b.at);
    persist();render();toast(`Added to ${fmtDate(fromIdx(day))}. It counts.`);return}
  if(kind==="unlock"){if(pinBusy)return;pinBusy=true;const L=photoLock();const ok=L&&(await hashPin(F.pin.value,L.salt))===L.hash;pinBusy=false;
    if(ok){photosUnlocked=true;if(L.resetAt){delete L.resetAt;persist()}closeModal();render();const fn=afterUnlock;afterUnlock=null;if(fn)fn()}else{const c=$(".lockcard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");F.pin.value="";F.pin.focus();toast("That passcode didn't match.")}return}
  if(kind==="setpin"){const a=F.pin.value.trim(),b2=F.pin2.value.trim();
    if(!/^\d{4,12}$/.test(a)){toast("Use 4 to 12 digits.");return}
    if(a!==b2){toast("Those didn't match. Try once more.");return}
    const salt=rid();S.settings=Object.assign({},S.settings,{photoLock:{salt,hash:await hashPin(a,salt)}});photosUnlocked=true;persist();closeModal();
    const pp=pendingPriv;pendingPriv=null;if(pp)setPrivacy(pp);else{render();toast("Passcode created.")}return}
  if(kind==="changepin"){const L=photoLock();if(!L||(await hashPin(F.pin.value,L.salt))!==L.hash){F.pin.value="";toast("That passcode didn't match.");return}
    const n=F.pin2.value.trim();if(!/^\d{4,12}$/.test(n)){toast("Use 4 to 12 digits for the new passcode.");return}
    const salt=rid();S.settings.photoLock={salt,hash:await hashPin(n,salt)};persist();render();toast("Passcode changed.");return}
  if(kind==="removepin"){const L=photoLock();if(L&&(await hashPin(F.pin.value,L.salt))===L.hash){delete S.settings.photoLock;const had=anyLocked();locksToBlur();persist();render();toast(had?"Passcode off. Locked photos are blurred instead.":"Passcode turned off.")}else{F.pin.value="";toast("That passcode didn't match.")}return}
  if(kind==="pastnote"){const text=F.text.value.trim();if(!text)return;S.pastNotes.push({id:rid(),text,at:Date.now()});persist();render();toast("Saved. Remind Me will show it to you when you need it.");return}
  if(kind==="addq"){const text=F.text.value.trim();if(!text)return;S.myQuotes.push({id:rid(),text,who:F.who.value.trim()});persist();render();toast("Added. It'll show up in your sky on its day.");return}
});

function saveNote(inp){const t=T(inp.dataset.note);const l=t&&t.log[t.log.length-1];if(l){l.note=inp.value.trim();persist()}}
document.addEventListener("keydown",e=>{
  if(story){if(e.key==="Escape"){closeStory();return}if(!story.opt.noNav&&!e.target.closest("input,textarea")){if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();showSlide(story.i+1)}if(e.key==="ArrowLeft"){e.preventDefault();showSlide(story.i-1)}}return}

});

function showStar(key){const c=allCompletions().find(x=>x.key===key);if(!c)return;const p=P(c.t.pid);
  toast(`${c.t.title}, ${fmtDate(c.at)}.${p?` For ${p.title}.`:""}${c.note?` \u201c${c.note}\u201d`:""}`)}
function showMs(id){const m=M(id);if(m)toast(`Milestone reached: ${m.title}, ${fmtDate(m.achievedAt)}.`)}
function skyTap(s){if(s.dataset.ms)showMs(s.dataset.ms);else if(s.dataset.win){const w=S.wins.find(x=>x.id===s.dataset.win);if(w)toast(`Proud of: ${w.text} (${fmtDate(w.at)})`)}else showStar(s.dataset.star)}
$("#sky").addEventListener("click",e=>{const s=e.target.closest("[data-star],[data-ms],[data-win]");if(s)skyTap(s)});

/* ---------- backup ---------- */
const toDataURL=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});
async function exportBackup(){
  toast("Preparing your backup…");
  const st=JSON.parse(JSON.stringify(S));
  for(const ph of st.photos){try{const b=await photoBlob(ph);if(b)ph.data=await toDataURL(b)}catch(e){}}
  const data=JSON.stringify({app:"proof",version:2,savedAt:Date.now(),state:st});
  const filename="proof-backup-"+ymd()+".json";
  try{
    const dl=window.claude&&window.claude.use?await claude.use("downloads"):null;
    if(dl){await dl.save({filename,data});toast("Backup saved.");return}
  }catch(e){toast("The backup wasn't saved. Try again when you're ready.");return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=filename;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Backup saved.");
}
document.addEventListener("change",async e=>{
  if(e.target.dataset&&e.target.dataset.freqsel){const f=e.target.closest("form");f.querySelector(".fdays").hidden=e.target.value!=="days";f.querySelector(".fweekly").hidden=e.target.value!=="weekly";return}
  if(e.target.dataset&&e.target.dataset.set){S.settings=Object.assign({},S.settings,{[e.target.dataset.set]:e.target.checked});persist();toast("Saved.");return}
  if(e.target.dataset&&e.target.dataset.deskTime){
    deskSettings=Object.assign({},deskSettings,{reminderTime:e.target.value||"19:00"});
    try{deskSettings=await desk.setSettings(deskSettings)}catch(err){}
    toast(`Reminder set for ${e.target.value}.`);return;
  }
  if(e.target.dataset&&e.target.dataset.desk){
    deskSettings=Object.assign({},deskSettings,{[e.target.dataset.desk]:e.target.checked});
    try{deskSettings=await desk.setSettings(deskSettings)}catch(err){}
    render();toast("Saved.");return;
  }
  if(e.target.id==="nameIn"){S.name=e.target.value.trim();persist();headline();toast(S.name?`Hello, ${S.name}.`:"Saved.");return}
  if(e.target.id!=="importIn")return;
  const file=e.target.files[0];e.target.value="";if(!file)return;
  try{
    const obj=JSON.parse(await file.text());const st=obj.state||obj;
    if(!Array.isArray(st.priorities)||!Array.isArray(st.tasks))throw 0;
    if((S.priorities.length||S.tasks.length)&&!confirm("Restore this backup? It replaces what's here now with the backup's priorities, steps, milestones, photos and stars."))return;
    toast("Restoring…");
    const photos=[];
    for(const ph of st.photos||[]){
      if(!ph.data)continue;
      try{const blob=await (await fetch(ph.data)).blob();const ref=await storePhoto(ph.id,blob);const {data,asset,url,...rest}=ph;photos.push({...rest,...ref})}catch(err){}
    }
    S=Object.assign(EMPTY(),st,{photos});S.seeded=true;
    migrate();persist();render();toast("Backup restored. Welcome back to your sky.");
  }catch(err){toast("That file isn't a Proof backup. Choose a file named proof-backup-\u2026.json.")}
});
