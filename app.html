:root{
  --bg:#F1F0F5; --surface:#FFFFFF; --ink:#2A2540; --muted:#6D6882; --line:#DCD8E6;
  --accent:#5E4390; --accent-ink:#FFFFFF; --soft:#E7E2F1;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16131F; --surface:#211D2D; --ink:#EDE9F5; --muted:#A29DB5; --line:#342E44;
    --accent:#C4AEF0; --accent-ink:#1B1630; --soft:#2C2640;
  }
}
:root[data-theme="dark"]{
  --bg:#16131F; --surface:#211D2D; --ink:#EDE9F5; --muted:#A29DB5; --line:#342E44;
  --accent:#C4AEF0; --accent-ink:#1B1630; --soft:#2C2640;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* Sky */
.sky-wrap{position:relative;height:clamp(300px,46vh,420px);background:#141030;overflow:hidden;border-radius:0 0 32px 32px}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.sky-text{position:absolute;left:0;right:0;bottom:0;padding:0 24px 26px;max-width:760px;margin:0 auto;color:#F5F1FF;pointer-events:none}
.sky-text p{margin:0 0 6px;font-size:15px;color:#E6DEF7;text-shadow:0 1px 10px rgba(20,10,40,.7)}
.sky-text h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(21px,3.8vw,32px);line-height:1.25;max-width:30ch;text-shadow:0 2px 18px rgba(10,6,30,.6)}
.sky-text .attr{margin:10px 0 0;font-size:15px;color:#E9D9A6}
.star{cursor:pointer}
.star circle.core{transition:r .2s}
.star:hover circle.core{r:5}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.55}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes born{0%{transform:scale(0);opacity:0}60%{transform:scale(2.2);opacity:1}100%{transform:scale(1)}}
.born{transform-box:fill-box;transform-origin:center;animation:born 1.2s cubic-bezier(.2,.8,.2,1)}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(3%)}}
.drift{animation:drift 24s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.tw,.born,.drift{animation:none}}

/* Layout */
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.tabs{display:flex;gap:6px;margin:22px auto 8px;padding:0 20px;max-width:760px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;border-radius:999px;color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--ink)}
main{padding-bottom:40px}
h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:18px 0 4px}
.lede{color:var(--muted);margin:0 0 20px;max-width:56ch}

/* Buttons & fields */
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:11px 20px;border-radius:999px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);padding:8px 12px}
.btn.quiet{background:var(--soft);color:var(--ink)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);resize:vertical}
.field textarea{min-height:88px;line-height:1.55}
.inline-add{display:flex;gap:8px;margin-top:10px}
.inline-add input{flex:1;min-width:0;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;background:transparent}
.inline-add input:focus{border-style:solid;background:var(--surface)}

/* Priorities */
.priority{background:var(--surface);border-radius:24px;padding:22px 22px 16px;margin-bottom:16px}
.p-head{display:flex;align-items:flex-start;gap:12px}
.p-dot{width:14px;height:14px;border-radius:50%;margin-top:9px;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.p-title{font-family:var(--serif);font-size:22px;margin:0;line-height:1.3}
.p-belief{margin:2px 0 0;color:var(--muted)}
.p-meta{margin-left:auto;display:flex;gap:2px;flex:none}
.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:10px;font-size:15px}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.tasks{list-style:none;margin:14px 0 0;padding:0}
.task{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;color:#241C3A;font-size:14px;padding:0}
.check.on{background:var(--c)}
.t-body{flex:1;min-width:0}
.t-title{overflow-wrap:anywhere}
.task.done .t-title{color:var(--muted)}
.t-sub{font-size:14px;color:var(--muted)}
.sun{background:none;border:0;cursor:pointer;font-size:17px;padding:4px 6px;border-radius:10px;opacity:.35;filter:grayscale(1)}
.sun.on{opacity:1;filter:none}
.note-in{width:100%;margin-top:6px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
details.kept summary{cursor:pointer;color:var(--muted);font-size:15px;padding:8px 0;list-style:none}
details.kept summary::-webkit-details-marker{display:none}
details.kept summary::before{content:"✦ ";color:var(--c)}
.newp{background:var(--surface);border-radius:24px;padding:22px;margin-bottom:16px}
.swatches{display:flex;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Today */
.today-card{background:var(--surface);border-radius:24px;padding:10px 22px}
.today-card .task{padding:14px 0}
.empty{background:var(--surface);border-radius:24px;padding:26px 22px;color:var(--muted)}
.empty p{margin:0 0 14px;max-width:48ch}

/* Checkpoints */
.since{background:var(--soft);border-radius:20px;padding:18px 20px;margin-bottom:20px}
.since p{margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.cp-form{background:var(--surface);border-radius:24px;padding:22px;margin-bottom:28px}
.cp{border-left:3px solid var(--accent);padding:4px 0 4px 18px;margin:0 0 30px}
.cp h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:0}
.cp .stat{color:var(--muted);font-size:15px;margin:2px 0 12px}
.cp dt{font-size:14px;color:var(--muted);margin-top:12px}
.cp dd{margin:2px 0 0;white-space:pre-wrap;max-width:62ch}

footer{max-width:760px;margin:0 auto;padding:10px 20px 40px;color:var(--muted);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 2px;width:12ch}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#2A2146;color:#F5F1FF;padding:14px 20px;border-radius:18px;max-width:min(92vw,460px);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 10px 40px rgba(20,10,40,.35);font-size:16px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border-radius:18px;padding:12px 14px;border:0;text-align:left;cursor:pointer}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.periods{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px;margin-bottom:14px}
.periods button{border:0;background:none;padding:7px 15px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.periods button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.pnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.pnav h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:0;flex:1}
.pnav button{background:var(--surface);border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:18px}
.pnav button:disabled{opacity:.35;cursor:default}
.card{background:var(--surface);border-radius:24px;padding:20px 22px;margin-bottom:16px}
.big{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:14px}
.big div b{display:block;font-family:var(--serif);font-weight:400;font-size:40px;line-height:1}
.big div span{color:var(--muted);font-size:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.bstack{flex:1;width:100%;max-width:38px;display:flex;flex-direction:column-reverse;justify-content:flex-start;border-radius:8px;overflow:hidden;background:var(--soft)}
.bstack i{display:block;width:100%}
.bcol span{font-size:12px;color:var(--muted)}
.bcol.now span{color:var(--ink);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:12px;color:var(--muted);text-align:center}
.cal .c{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;background:var(--soft);color:var(--muted)}
.cal .c.on{color:var(--accent-ink)}
.cal .c.now{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .c.fut{opacity:.4}
.brk{list-style:none;margin:0;padding:0}
.brk li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:9px 0;border-top:1px solid var(--line)}
.brk li:first-child{border-top:0}
.brk li.sub{padding-left:18px}
.brk .bar{grid-column:1/-1;margin:0}
.brk .bar i{background:var(--c)}
.rise{background:linear-gradient(160deg,#2E2352,#5B3E6E);color:#F5F1FF;border-radius:24px;padding:22px}
.rise h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 8px;line-height:1.25}
.rise p{margin:0 0 6px;color:#DCD3F2;max-width:58ch}
.rise .nums{display:flex;gap:26px;margin-top:14px;flex-wrap:wrap}
.rise .nums b{display:block;font-family:var(--serif);font-weight:400;font-size:32px;color:#F6D98B}
.rise .nums span{font-size:14px;color:#CFC6EA}

/* Home */
.showup{background:var(--surface);border-radius:24px;padding:18px 22px;margin-bottom:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.showup p{margin:0;flex:1;min-width:200px}
.week{display:flex;gap:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.day i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:block}
.day.on i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 55%,transparent)}
.day.now span{color:var(--ink);font-weight:600}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
.filter{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;font-size:15px;color:var(--muted)}
.filter[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0 4px}
.list-head strong{font-weight:600}
.list-head span{color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s}
details.more{margin-top:4px;border-top:1px solid var(--line)}
details.more summary{cursor:pointer;color:var(--muted);padding:12px 0;font-size:15px}
h3.sec{font-family:var(--serif);font-weight:400;font-size:21px;margin:30px 0 12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{background:var(--surface);border-radius:20px;padding:16px 18px;text-align:left;border:0;cursor:pointer;display:block;width:100%}
.pcard:hover{box-shadow:inset 0 0 0 1.5px var(--c)}
.pcard b{font-family:var(--serif);font-weight:400;font-size:18px;display:flex;align-items:center;gap:9px}
.pcard b i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.pcard small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.pcard em{display:block;font-style:normal;font-size:14px;margin-top:10px;color:var(--ink)}
.kind{background:none;border:1px solid var(--line);border-radius:999px;font-size:12px;padding:2px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.cat-h{font-size:15px;color:var(--muted);margin:26px 0 10px;font-weight:500}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;flex:none}
.seg label{padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.inline-add{flex-wrap:wrap}
.catpick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.catpick label{border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:15px}
.catpick input{position:absolute;opacity:0;pointer-events:none}
.catpick label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.catpick label:has(input:focus-visible){outline:2px solid var(--accent)}
.cats{background:var(--surface);border-radius:24px;padding:18px 22px;margin-top:26px}
.cats .chips{margin:8px 0 10px}
.cats .chip{background:var(--soft)}
.cats .chip button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 0 0 2px}

/* Menu button + drawer */
.menu-btn{position:absolute;top:14px;left:14px;z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:rgba(20,14,40,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;cursor:pointer;display:grid;place-items:center}
.menu-btn svg{width:22px;height:22px}
.menu-btn:hover{background:rgba(20,14,40,.55)}
.scrim{position:fixed;inset:0;background:rgba(12,8,28,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--surface);z-index:41;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;overflow-y:auto;visibility:hidden}
#drawer.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s;box-shadow:8px 0 40px rgba(12,8,28,.25)}
#drawer .d-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 14px}

#drawer .d-item{display:flex;align-items:center;gap:14px;border:0;background:none;padding:12px 14px;border-radius:14px;cursor:pointer;font-size:17px;color:var(--ink);text-align:left;width:100%}
#drawer .d-item svg{width:22px;height:22px;flex:none;color:var(--muted)}
#drawer .d-item:hover{background:var(--soft)}
#drawer .d-item[aria-current="page"]{background:var(--soft);font-weight:600}
#drawer .d-item[aria-current="page"] svg{color:var(--accent)}
#drawer hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
#drawer .d-foot{margin-top:auto;padding:12px 14px 0;font-size:14px;color:var(--muted)}
.tabs .more{display:none}
@media (prefers-reduced-motion: reduce){#drawer,.scrim{transition:none}}

/* Settings */
.skies{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0 4px}
.skyopt{border:0;padding:0;border-radius:16px;overflow:hidden;cursor:pointer;background:none;text-align:left;box-shadow:0 0 0 2px transparent}
.skyopt i{display:block;height:74px}
.skyopt span{display:block;padding:7px 10px;font-size:14px;background:var(--soft)}
.skyopt[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.radios{display:flex;flex-direction:column;gap:8px;margin:10px 0 6px}
.radios label,.toggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.radios input,.toggle input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.toggle{padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle small{display:block;color:var(--muted);font-size:14px}
.toggle.off{opacity:.5}

/* Hard day, wins, letters, memories, recap */
.hard-link{display:flex;gap:10px;flex-wrap:wrap;margin:-4px 0 16px}
.hard-link .btn{padding:8px 14px;font-size:15px}
.hard{background:linear-gradient(160deg,#3A2F5E,#6C5A8E);color:#F5F1FF;border-radius:24px;padding:24px 22px;margin:14px 0 16px}
.hard h2{margin:0 0 8px;color:#fff}
.hard p{margin:0 0 16px;color:#E4DCF5;max-width:52ch}
.hard .btn{background:#F2B5C8;color:#2A2146}
.hard .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.hard .btn:disabled{opacity:.85;cursor:default}
.evidence ul{list-style:none;margin:10px 0 0;padding:0}
.evidence li{padding:12px 0;border-top:1px solid var(--line)}
.evidence li:first-child{border-top:0}
.evidence li p{margin:0;font-family:var(--serif);font-size:19px;line-height:1.35}
.evidence li small{color:var(--muted);font-size:14px}
.tinybtn{background:var(--soft);border:0;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;margin-top:6px;color:var(--ink);display:inline-block;text-align:left}
.tinybtn b{font-weight:600}
.addtiny{background:none;border:0;padding:0;margin-top:4px;color:var(--accent);font-size:13px;cursor:pointer}
.edit-task{flex:1;display:flex;flex-direction:column;gap:8px}
.edit-task input{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
.edit-task small{color:var(--muted);font-size:13px}
.otd{display:flex;gap:16px;align-items:center}
.otd .otd-txt{flex:1;min-width:0}
.otd .otd-txt p{margin:4px 0 0}
.otd .otd-txt .label{font-size:14px;color:var(--accent);font-weight:600}
.otd .otd-ph{width:92px;flex:none}
.otd .otd-ph img{width:92px;height:122px;object-fit:cover;border-radius:14px;display:block}
.letter-ready{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border-radius:24px;padding:18px 22px;margin:14px 0 16px;box-shadow:inset 0 0 0 2px #F2B5C8}
.letter-ready>span{font-size:34px;line-height:1}
.letter-ready div{flex:1;min-width:180px}
.letter-ready h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:0}
.letter-ready p{margin:2px 0 0;color:var(--muted);font-size:15px}
.letter-body{font-family:var(--serif);font-size:20px;line-height:1.55;white-space:pre-wrap;margin:14px 0 20px}
.envelopes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0}
.env{background:var(--soft);border-radius:16px;padding:14px 16px;font-size:15px}
.env b{display:block;font-family:var(--serif);font-weight:400;font-size:17px;margin-bottom:2px}
.env .row{margin-top:8px}
.recap{background:linear-gradient(160deg,var(--surface),color-mix(in srgb,#F6D98B 22%,var(--surface)))}
.recap h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:2px 0 12px}
.recap .big b{font-size:32px}
.wins-list{list-style:none;margin:8px 0 0;padding:0}
.wins-list li{padding:8px 0;border-top:1px solid var(--line)}
.wins-list li:first-child{border-top:0}
.wins-list small{color:var(--muted);display:block;font-size:13px}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}8%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.shoot{animation:shoot 1.6s cubic-bezier(.3,.6,.4,1) .3s forwards;opacity:0}
.c-name{font-family:var(--serif);font-style:italic;pointer-events:none}
@keyframes qfade{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.qfade #headline,.qfade #attr{animation:qfade 1s ease-out both}
.qfade #attr{animation-delay:.25s}
@keyframes bloom{0%{transform:scale(0) rotate(-35deg);opacity:0}55%{transform:scale(2) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.bloom{transform-box:fill-box;transform-origin:center;animation:bloom 1.5s cubic-bezier(.2,.8,.2,1) .55s both}
@keyframes ring{0%{transform:scale(1);opacity:.95}100%{transform:scale(10);opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.4s ease-out .6s both;fill:none;stroke-width:1.4;vector-effect:non-scaling-stroke}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(.3);opacity:0}}
.spark{animation:spark 1.2s cubic-bezier(.2,.7,.3,1) .7s both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s ease-in-out .5s forwards}
@keyframes cname{0%{opacity:0;letter-spacing:.5em}100%{opacity:.7;letter-spacing:.02em}}
.cname-in{animation:cname 2s ease-out 1.6s both}
@media (prefers-reduced-motion: reduce){.bloom,.ring,.spark,.draw,.cname-in{animation:none!important;opacity:1;stroke-dashoffset:0}.ring,.spark{display:none}}

/* Frequency, backfill, privacy, safety */
.freq{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.freq>span{font-size:13px;color:var(--muted)}
.freq select,.freq input[type=number]{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.freq input[type=number]{width:70px}
.fdays{display:flex;flex-wrap:wrap;gap:6px}
.fdays label{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:14px;cursor:pointer}
.fdays input{position:absolute;opacity:0;pointer-events:none}
.fdays label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fdays label:has(input:focus-visible){outline:2px solid var(--accent)}
.fweekly{display:flex;align-items:center;gap:8px;font-size:15px}
[hidden]{display:none!important}
.backfill{background:var(--soft);border-radius:18px;padding:16px;margin-top:16px}
.backfill strong{display:block;margin-bottom:10px}
.backfill select,.backfill input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0;flex:1 1 160px}
.unlog{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:8px}
.unlog:hover{background:var(--soft);color:var(--ink)}
.lockcard{background:var(--surface);border-radius:24px;padding:34px 22px;text-align:center;max-width:420px;margin:10px auto}
.lockcard .lock-ic{font-size:40px}

.lockcard form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pin{font-size:22px;letter-spacing:.35em;text-align:center;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);width:190px}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s 2}
.blurred img{filter:blur(18px) saturate(.7);transition:filter .3s}
.tapshow{position:relative;display:block;cursor:pointer;border-radius:16px;overflow:hidden}
.tapshow::after{content:"Tap to show";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none}
.tapshow.reveal::after{display:none}
.ph-lock{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(160deg,#2E2352,#4A3A6E);color:#E9E2F7;font-size:24px}
.ptile .badge{position:absolute;top:6px;right:6px;font-size:12px;background:rgba(20,14,40,.6);color:#fff;border-radius:999px;padding:2px 7px;line-height:18px}
.pseg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.pseg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--muted)}
.pseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,10,40,.12)}
.privrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.privrow:first-of-type{border-top:0}
.privrow small{display:block;color:var(--muted);font-size:13px}
.viewer-priv{margin:12px 4px 4px}
.viewer-priv p{margin:0 0 6px;font-size:14px;color:var(--muted)}
.priv-panel h4{font-weight:600;font-size:15px;margin:18px 0 4px}
.addstep-more{display:none;flex-basis:100%;flex-direction:column;gap:10px;padding:4px 2px 2px}
.addstep.open .addstep-more{display:flex}
.addstep-more>input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
.addstep-more .row{margin:0}
.delbtn{background:#B4384F;color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .delbtn{background:#E07A8E;color:#1B1630}}
:root[data-theme="dark"] .delbtn{background:#E07A8E;color:#1B1630}
.addstep .fweekly input{flex:none;width:72px;border-style:solid;background:var(--surface);padding:8px 10px}
.addstep .freq select{font-size:15px;max-width:320px}
.addstep .fdays input{flex:none}
.blurred.reveal img{filter:none}
.tn figure.blurred,.otd-ph.blurred{cursor:pointer}
.otd-lock{width:92px;height:122px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:26px;flex:none}
.safety{border-top:1px solid var(--line);margin-top:20px;padding-top:16px;color:var(--muted);font-size:15px;max-width:60ch}
.safety p{margin:0 0 6px}
.safety a{color:var(--accent);font-weight:600}
.pinrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pinrow input{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:150px;letter-spacing:.2em}

/* Story overlay (Remind Me + Year in Proof) */
.story{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 90% at 50% 100%,#3A2A5C 0%,#1A1236 45%,#08061A 100%);color:#F5F1FF;overflow:hidden;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
.story canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.story-top{position:relative;z-index:2;display:flex;align-items:center;gap:12px}
.story-bars{flex:1;display:flex;gap:4px}
.story-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.story-bars i.on{background:rgba(255,255,255,.9)}
.story-x{background:rgba(255,255,255,.1);border:0;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;flex:none}

.story-card{max-width:560px;width:100%;padding:8px 4px}

@keyframes storyIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.story-card .kick{font-size:15px;color:#E9D9A6;margin:0 0 12px}

.story-card .big{font-family:var(--serif);font-size:clamp(64px,16vw,112px);line-height:1;color:#F6D98B;text-shadow:0 0 40px rgba(246,217,139,.45);margin:4px 0 6px}

.story-card .row{margin-top:18px;gap:10px}
.story-card .btn{background:#F6D98B;color:#241B3F}
.story-card .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.story-card .tn img{border-radius:14px}

.story-card label.st{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:#CFC6EA;margin-top:18px;cursor:pointer}

.remind-btn{background:linear-gradient(135deg,#F6D98B,#F2B5C8)!important;color:#241B3F!important}

.pastnote-card textarea{width:100%;min-height:96px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);resize:vertical;line-height:1.55;margin:10px 0 12px}

/* Welcome + tour */
.wel{position:fixed;inset:0;z-index:75;background:radial-gradient(120% 90% at 50% 100%,#3A2A5C 0%,#1A1236 45%,#08061A 100%);color:#F5F1FF;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.wel canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.wel-in{position:relative;z-index:1;width:100%;max-width:520px;margin:auto 0;padding:24px 0}
.wel-dots{display:flex;gap:6px;margin-bottom:28px}
.wel-dots i{width:22px;height:4px;border-radius:4px;background:rgba(255,255,255,.2)}
.wel-dots i.on{background:#F6D98B}
.wel h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,8vw,52px);line-height:1.1;margin:0 0 14px;color:#fff;text-wrap:balance}
.wel h2{font-size:clamp(26px,6vw,36px);line-height:1.2;margin:0 0 10px;color:#fff;text-wrap:balance}
.wel p{font-size:18px;line-height:1.55;color:#E4DCF5;margin:0 0 18px;max-width:40ch}
.wel .field span{color:#CFC6EA}
.wel .field input,.wel select,.wel .freq input[type=number]{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:14px}
.wel .field input::placeholder{color:rgba(255,255,255,.45)}
.wel .fdays label{border-color:rgba(255,255,255,.3)}
.wel .fdays label:has(input:checked){background:#F6D98B;color:#241B3F;border-color:#F6D98B}
.wel .freq>span{color:#CFC6EA}
.wel .btn{background:#F6D98B;color:#241B3F}
.wel .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.wel .chips{margin:-4px 0 16px}
.wel .chip{background:rgba(255,255,255,.1);color:#fff;border:0;cursor:pointer;font:inherit;font-size:15px}
.wel .skip{background:none;border:0;color:#CFC6EA;cursor:pointer;font:inherit;font-size:15px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.wel .firststep{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.07);border-radius:18px;padding:16px 18px;margin:6px 0 18px}
.wel .firststep b{font-weight:500;font-size:18px}
.wel .firststep small{display:block;color:#CFC6EA;font-size:14px}
.tour-block{position:fixed;inset:0;z-index:62}
.tour-spot{position:absolute;border-radius:18px;box-shadow:0 0 0 9999px rgba(8,6,26,.72),0 0 0 3px #F6D98B;transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tour-card{position:fixed;z-index:66;width:min(360px,calc(100vw - 32px));background:#221A3E;color:#F5F1FF;border-radius:20px;padding:18px 18px 14px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.1);transition:top .35s,left .35s}
.tour-card small{color:#E9D9A6;font-size:13px}
.tour-card h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:4px 0 6px;line-height:1.3}
.tour-card p{margin:0 0 14px;color:#DCD3F2;font-size:16px;line-height:1.5}
.tour-card .row{gap:8px;justify-content:space-between}
.tour-card .btn{background:#F6D98B;color:#241B3F;padding:9px 16px}
.tour-card .btn.ghost{background:transparent;color:#CFC6EA;padding:9px 6px}
.tour-pill{position:fixed;z-index:67;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#F2B5C8;color:#241B3F;font-size:13px;font-weight:600;border-radius:999px;padding:5px 14px;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.tour-spot,.tour-card{transition:none}}

/* Star shapes */
.star-preview{background:linear-gradient(180deg,#141030,#2E2352);border-radius:16px;margin:12px 0 4px;padding:6px 0}
.star-preview svg{display:block;width:100%;max-width:420px;margin:0 auto}
.shape-label{margin:14px 0 6px;font-size:14px;color:var(--muted)}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.shapeopt{border:0;background:#1E1838;border-radius:14px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 0 0 2px transparent}
.shapeopt svg{width:34px;height:34px}
.shapeopt span{font-size:12px;color:#CFC6EA}
.shapeopt[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}

/* Reflect sections */
.rnav{display:flex;flex-wrap:wrap;gap:8px;overflow-x:auto;margin:0 0 18px;padding-bottom:4px;scrollbar-width:none}
.rnav::-webkit-scrollbar{display:none}
.rnav button{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:500;color:var(--ink);white-space:nowrap}
.rnav button span{font-size:13px;color:var(--muted);background:var(--soft);border-radius:999px;padding:0 8px;line-height:20px}
.rnav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rnav button[aria-pressed="true"] span{background:rgba(255,255,255,.18);color:inherit}
.rhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rhead p{margin:0;color:var(--muted);max-width:52ch}
@media (prefers-reduced-motion: reduce){.shoot{display:none}}

/* Nav with icons */
.tabs button{display:inline-flex;align-items:center;gap:7px}
.tabs svg{width:18px;height:18px;flex:none}
@media (max-width:640px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;max-width:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:20;gap:0;overflow:visible}
  .tabs button{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:6px 0;border-radius:12px;min-width:0}
  .tabs svg{width:22px;height:22px}
  body{padding-bottom:84px}
  .tabs .more{display:flex}
  .rnav{flex-wrap:nowrap;margin-right:-20px;padding-right:20px}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  main{padding-top:12px}
  .priority,.card,.cp-form,.newp{padding-left:18px;padding-right:18px}
}

/* Check-in + milestones */
.checkin{background:linear-gradient(160deg,#2E2352,#5B3E6E);color:#F5F1FF;border-radius:24px;padding:20px 22px;margin:14px 0 16px}
.checkin h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:4px 0 6px}
.checkin p{margin:0 0 14px;color:#DCD3F2}
.checkin .btn{background:#F6D98B;color:#2A2146}
.checkin .btn.ghost{background:transparent;color:#F5F1FF}
.soon{color:var(--muted);font-size:15px;margin:-4px 0 16px}
.soon button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
.ms{background:var(--surface);border-radius:24px;padding:20px 22px;margin-bottom:14px;border-left:5px solid var(--c)}
.ms-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.ms-when{font-size:14px;font-weight:600;color:var(--accent)}
.pill{font-size:13px;background:var(--soft);border-radius:999px;padding:2px 10px;color:var(--ink)}
.ms h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:2px 0 4px;line-height:1.3}
.ms p{margin:0 0 6px}
.ms .why{color:var(--muted)}
.ms-hist{list-style:none;margin:12px 0 4px;padding:0;font-size:15px}
.ms-hist li{padding:6px 0 6px 20px;position:relative;color:var(--muted)}
.ms-hist li::before{content:"↻";position:absolute;left:0;color:var(--c)}
.ms-hist li.win::before{content:"✦"}
.ms .row{margin-top:12px}
.ms.won{background:linear-gradient(135deg,var(--surface) 60%,color-mix(in srgb,var(--c) 30%,var(--surface)))}
.retry{background:var(--soft);border-radius:18px;padding:16px;margin-top:12px}
.retry p{margin:0 0 12px}
.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}

/* Photos */
.pgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.ptile{aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:0;padding:0;position:relative;background:var(--soft);cursor:pointer;display:block;width:100%}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.ptile span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(10,6,30,.7));text-align:left}
.ptile[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.tn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 8px}
.tn figure{margin:0}
.tn img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;display:block;background:var(--soft)}
.tn figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.tn figcaption b{color:var(--ink);font-weight:600;display:block}
.month-h{font-size:15px;color:var(--muted);margin:22px 0 10px;font-weight:500}
.preview{width:100%;max-height:340px;object-fit:contain;border-radius:16px;background:var(--soft);margin-bottom:14px;display:block}

/* Modal + confetti */
.modal{position:fixed;inset:0;background:rgba(12,8,28,.74);display:grid;place-items:center;z-index:50;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.modal-box{background:var(--surface);border-radius:24px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:18px}
.modal-box img{width:100%;max-height:62vh;object-fit:contain;border-radius:16px;background:var(--soft);display:block}
.celebrate{text-align:center;padding:30px 24px;background:linear-gradient(170deg,#141030,#3A2A5C 60%,#6B4A78);color:#F5F1FF}
.celebrate .burst{font-size:64px;line-height:1;color:#F6D98B;text-shadow:0 0 30px rgba(246,217,139,.8)}
.celebrate h2{font-size:clamp(26px,6vw,36px);margin:14px 0 8px}
.celebrate p{color:#DCD3F2;margin:0 auto 14px;max-width:40ch}
.celebrate .btn{background:#F6D98B;color:#2A2146}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.quotes-list{list-style:none;padding:0;margin:10px 0}
.quotes-list li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.quotes-list li:first-child{border-top:0}
.quotes-list q{flex:1}
</style>
</head>

<script>
const COLORS=["#F6D98B","#F2B5C8","#A9D8C8","#B9C3F5","#F7C6A3","#D7B8F2"];

  const n=all.length,i=dIdx(Date.now()),cycle=Math.floor(i/n);

const DAYS_SHORT=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const freqOf=t=>t.freq&&t.freq.type?t.freq:{type:"daily"};
function weekCount(t){const r=range("week",0);return t.log.filter(l=>l.at>=r.a&&l.at<r.b).length}
function dueToday(t){const f=freqOf(t);if(pinned(t)||doneToday(t))return true;if(f.type==="days")return (f.days||[]).includes(new Date().getDay());if(f.type==="weekly")return weekCount(t)<(f.times||1);return true}
function freqLabel(t){const f=freqOf(t);if(f.type==="days"){const d=[1,2,3,4,5,6,0].filter(x=>(f.days||[]).includes(x));return d.length===7?"Every day":d.map(x=>DAYS_SHORT[x]).join(", ")}if(f.type==="weekly")return `${f.times}× a week`;return "Every day"}
function reason(t){
  const now=Date.now(),wd=new Date().getDay();
  if(pinned(t))return "You chose this for today";
  const f=freqOf(t);
  if(f.type==="days")return (f.days||[]).includes(wd)?`It's ${WEEKDAYS[wd]}, one of your days`:`Usually on ${freqLabel(t)}`;
  if(f.type==="weekly"){const n=weekCount(t);return n>=f.times?`${n} of ${f.times} this week. All done, lovely`:`${n} of ${f.times} this week`}
  if(!t.log.length)return "New. Today could be the first time";
  const sameDay=t.log.filter(l=>now-l.at<35*DAY&&new Date(l.at).getDay()===wd).length;
  if(sameDay>=2)return `You usually do this on ${WEEKDAYS[wd]}s`;
  const recent=t.log.filter(l=>now-l.at<14*DAY).length;
  if(recent>=2)return `You've done this ${recent} times in the last two weeks`;
  return "Daily step";
}
function score(t){
  const now=Date.now(),wd=new Date().getDay();
  if(pinned(t))return 1000;
  const f=freqOf(t);
  if(f.type==="days")return (f.days||[]).includes(wd)?60:-1;
  if(f.type==="weekly"){const left=f.times-weekCount(t);if(left<=0)return -1;const daysLeft=7-((wd+6)%7);return 20+Math.round(Math.min(1,left/daysLeft)*40)}
  if(!t.log.length)return 1;
  const sameDay=t.log.filter(l=>now-l.at<35*DAY&&new Date(l.at).getDay()===wd).length;
  const recent=t.log.filter(l=>now-l.at<14*DAY).length;
  return 5+sameDay*4+recent;
}

const IDB={p:null,
  open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open("proof-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction("p",mode);const r=fn(tx.objectStore("p"));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})},
  put(k,v){return this.run("readwrite",s=>s.put(v,k))},get(k){return this.run("readonly",s=>s.get(k))},del(k){return this.run("readwrite",s=>s.delete(k))}};
const photoURLs={};
function photoSrc(ph){
  if(ph.asset)return ph.url||("/_blob/"+ph.asset);
  if(photoURLs[ph.id])return photoURLs[ph.id];
  IDB.get(ph.id).then(b=>{if(!b)return;photoURLs[ph.id]=URL.createObjectURL(b);document.querySelectorAll(`img[data-ph="${ph.id}"]`).forEach(i=>i.src=photoURLs[ph.id])}).catch(()=>{});
  return "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
}
const img=(ph,alt)=>`<img data-ph="${ph.id}" src="${esc(photoSrc(ph))}" alt="${esc(alt||ph.caption||"Photo from "+fmtYmd(ph.date))}" loading="lazy">`;
async function shrink(file){
  const url=URL.createObjectURL(file);const im=new Image();im.src=url;
  try{await im.decode()}finally{}
  const m=1600,sc=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",.86));
}
async function storePhoto(id,blob){
  if(tour)throw new Error("tour");
  if(assetsNS){const r=await assetsNS.upload(blob);return{asset:r.id,url:r.url}}
  await IDB.put(id,blob);photoURLs[id]=URL.createObjectURL(blob);return{};
}
async function deletePhotos(ids){

async function photoBlob(ph){if(ph.asset){const r=await fetch(photoSrc(ph));return await r.blob()}return await IDB.get(ph.id)}

function skyBg(key,W,H){

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${Math.max(14,W/40)}"/></filter>`;
  let body=`<rect width="${W}" height="${H}" fill="url(#bg)"/>`;
  const dust=Math.round(W*H/5200*k.dust);
  for(let i=0;i<dust;i++)body+=`<circle cx="${(rnd("dx"+i)*W).toFixed(1)}" cy="${(rnd("dy"+i)*H*.85).toFixed(1)}" r="${(.5+rnd("dr"+i)*.9).toFixed(2)}" fill="#fff" opacity="${(.15+rnd("do"+i)*.4).toFixed(2)}"/>`;
  if(k.aurora){
    const w=(y,a)=>`M${-W*.1},${H*y} C${W*.25},${H*(y-a)} ${W*.45},${H*(y+a)} ${W*.7},${H*(y-a*.6)} S${W*1.05},${H*(y+a*.4)} ${W*1.1},${H*(y-.02)}`;
    body+=`<g class="drift" filter="url(#soft)" fill="none" stroke-linecap="round"><path d="${w(.3,.14)}" stroke="#3DDC97" stroke-width="${H*.14}" opacity=".55"/><path d="${w(.2,.1)}" stroke="#5BC0EB" stroke-width="${H*.08}" opacity=".35"/><path d="${w(.4,.08)}" stroke="#B38CF2" stroke-width="${H*.07}" opacity=".35"/></g>`;
  }
  if(k.moon){const x=W*.8,y=H*.2,r=Math.min(W,H)*.07;
    body+=`<circle cx="${x}" cy="${y}" r="${r*2.4}" fill="#DCE3FF" opacity=".12" filter="url(#soft)"/><mask id="cres"><rect width="${W}" height="${H}" fill="#fff"/><circle cx="${x+r*.45}" cy="${y-r*.2}" r="${r*.92}" fill="#000"/></mask><circle cx="${x}" cy="${y}" r="${r}" fill="#F4F1FF" mask="url(#cres)"/>`}
  if(k.clouds){for(let i=0;i<5;i++){const cx=rnd("cx"+key+i)*W,cy=H*(.12+rnd("cy"+key+i)*.45),rx=W*(.12+rnd("cr"+i)*.12);body+=`<ellipse class="drift" cx="${cx}" cy="${cy}" rx="${rx}" ry="${rx*.22}" fill="#fff" opacity="${k.light?.45:.18}" filter="url(#soft)"/>`}}
  if(k.sun){const x=W*k.sun.x,y=H*k.sun.y,r=Math.min(W,H)*k.sun.r;
    body+=`<circle cx="${x}" cy="${y}" r="${r*2.6}" fill="${k.sun.c}" opacity=".35" filter="url(#soft)"/><circle cx="${x}" cy="${y}" r="${r}" fill="${k.sun.c}" opacity=".95"/>`}
  if(k.hills)body+=`<path d="M0,${H*.86} C${W*.2},${H*.78} ${W*.38},${H*.84} ${W*.55},${H*.8} S${W*.85},${H*.74} ${W},${H*.82} V${H} H0Z" fill="#3A1C45" opacity=".85"/><path d="M0,${H*.93} C${W*.25},${H*.86} ${W*.5},${H*.95} ${W*.75},${H*.88} S${W},${H*.9} ${W},${H*.9} V${H} H0Z" fill="#200F2C"/>`;
  return {defs:o,body,light:!!k.light};
}

const SHAPE_SIZE={dot:1,sparkle:2.2,star:2.1,heart:1.6,flower:2.1,diamond:1.9,moon:1.8,clover:2.1};

const shapeOf=k=>{const v=(S.settings&&S.settings.starShapes||{})[k];return SHAPES[v]?v:DEFAULT_SHAPES[k]};
function shapeSVG(shape,x,y,R,fill,cls="",style=""){
  const f=n=>n.toFixed(2),a=`class="${cls}" ${style?`style="${style}"`:""} fill="${fill}"`;
  if(shape==="dot")return `<circle ${a} cx="${f(x)}" cy="${f(y)}" r="${f(R)}"/>`;
  if(shape==="sparkle")return `<path ${a} d="${sparkle(x,y,R)}"/>`;
  if(shape==="star"){let d="";for(let i=0;i<10;i++){const r=i%2?R*.44:R,t=-Math.PI/2+i*Math.PI/5;d+=(i?"L":"M")+f(x+Math.cos(t)*r)+","+f(y+Math.sin(t)*r)}return `<path ${a} d="${d}Z"/>`}
  if(shape==="heart")return `<path ${a} d="M${f(x)},${f(y+R)} C${f(x-1.67*R)},${f(y-.12*R)} ${f(x-.76*R)},${f(y-1.43*R)} ${f(x)},${f(y-.57*R)} C${f(x+.76*R)},${f(y-1.43*R)} ${f(x+1.67*R)},${f(y-.12*R)} ${f(x)},${f(y+R)}Z"/>`;
  if(shape==="diamond")return `<path ${a} d="M${f(x)},${f(y-R)} L${f(x+.64*R)},${f(y)} L${f(x)},${f(y+R)} L${f(x-.64*R)},${f(y)}Z"/>`;
  if(shape==="moon")return `<path ${a} d="M${f(x+.3*R)},${f(y-.95*R)} A${f(R)},${f(R)} 0 1 0 ${f(x+.3*R)},${f(y+.95*R)} A${f(.78*R)},${f(.78*R)} 0 1 1 ${f(x+.3*R)},${f(y-.95*R)}Z"/>`;
  if(shape==="flower"){let g="";for(let i=0;i<5;i++){const t=-Math.PI/2+i*2*Math.PI/5;g+=`<circle cx="${f(x+Math.cos(t)*R*.55)}" cy="${f(y+Math.sin(t)*R*.55)}" r="${f(R*.42)}"/>`}return `<g ${a}>${g}<circle cx="${f(x)}" cy="${f(y)}" r="${f(R*.3)}" fill="#fff" opacity=".85"/></g>`}
  if(shape==="clover"){let g="";for(let i=0;i<4;i++){const t=Math.PI/4+i*Math.PI/2;g+=`<circle cx="${f(x+Math.cos(t)*R*.45)}" cy="${f(y+Math.sin(t)*R*.45)}" r="${f(R*.45)}"/>`}return `<g ${a}>${g}</g>`}
  return `<circle ${a} cx="${f(x)}" cy="${f(y)}" r="${f(R)}"/>`;
}
function sparkle(x,y,R){const r=R*.28;return `M${x},${y-R} L${x+r},${y-r} L${x+R},${y} L${x+r},${y+r} L${x},${y+R} L${x-r},${y+r} L${x-R},${y} L${x-r},${y-r} Z`}
function drawSky(){
  const svg=$("#sky"),W=svg.clientWidth||800,H=svg.clientHeight||320;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const key=activeSky(),bg=skyBg(key,W,H);curSky=key;
  let out=`<defs><filter id='glow' x='-200%' y='-200%' width='500%' height='500%'><feGaussianBlur stdDeviation='3.5'/></filter>${bg.defs}</defs>${bg.body}<rect width="${W}" height="${H}" fill="url(#scrimg)"/>`;
  const halo=(x,y)=>bg.light?`<circle cx="${x}" cy="${y}" r="7" fill="#2A1540" opacity=".28" filter="url(#glow)"/>`:"";
  const stepShape=shapeOf("step"),winShape=shapeOf("win"),msShape=shapeOf("ms");
  const byP={};
  allCompletions().forEach(c=>{(byP[c.t.pid]=byP[c.t.pid]||[]).push(c)});
  const usableH=H*.5;
  for(const pid in byP){
    const p=P(pid),col=p?p.color:"#fff";
    const cx=68+rnd("px"+pid)*(W-136),cy=70+rnd("py"+pid)*Math.max(10,H*.3-60);
    const n=byP[pid].length,spread=Math.min(W,H)*(.2+Math.min(.14,n*.004));
    const pts=byP[pid].sort((a,b)=>a.at-b.at).map(c=>{
      const a=rnd("a"+c.key)*Math.PI*2,d=Math.sqrt(rnd("d"+c.key))*spread;
      return{c,x:Math.max(10,Math.min(W-10,cx+Math.cos(a)*d*1.4)),y:Math.max(10,Math.min(H*.5,cy+Math.sin(a)*d*.8))};
    });
    const line=pts.slice(-24);
    const bornHere=pts.some(q=>q.c.key===bornKey),animLine=(bornHere||conAnim===pid)&&line.length>1;
    if(line.length>1)out+=`<polyline ${animLine?`class="draw" pathLength="1"`:""} points="${line.map(q=>q.x.toFixed(1)+","+q.y.toFixed(1)).join(" ")}" fill="none" stroke="${bg.light?"#3A2350":col}" stroke-opacity="${animLine?(bg.light?.45:.55):(bg.light?.25:.2)}" stroke-width="${animLine?1.4:1}"/>`;
    if(p&&p.constellation&&pts.length>=2){const top=Math.min(...pts.map(q=>q.y)),mx=pts.reduce((a,q)=>a+q.x,0)/pts.length;
      const nameIn=conAnim===pid||(bornHere&&pts.length===2);
      out+=`<text class="c-name${nameIn?" cname-in":""}" x="${Math.max(40,Math.min(W-40,mx)).toFixed(1)}" y="${Math.max(16,top-12).toFixed(1)}" text-anchor="middle" font-size="12" fill="#fff" opacity=".62">${esc(p.constellation)}</text>`}
    pts.forEach(q=>{
      const tiny=q.c.tiny;
      if(q.c.key===bornKey)out+=`<circle class="ring" cx="${q.x}" cy="${q.y}" r="3" stroke="${col}"/>`;
      out+=`<g class="star ${q.c.key===bornKey?"born":""}" data-star="${esc(q.c.key)}" tabindex="0" role="button" aria-label="${esc(q.c.t.title)}"><title>${esc(q.c.t.title)}</title>
        <circle cx="${q.x}" cy="${q.y}" r="14" fill="transparent"/>${halo(q.x,q.y)}<circle cx="${q.x}" cy="${q.y}" r="6" fill="${col}" opacity=".55" filter="url(#glow)"/>
        ${shapeSVG(stepShape,q.x,q.y,(tiny?2.3:3.2)*SHAPE_SIZE[stepShape],col,"core tw",`animation-delay:-${(rnd("tw"+q.c.key)*4).toFixed(2)}s`)}</g>`;
    });
  }
  S.milestones.filter(m=>m.status==="achieved").forEach(m=>{
    const x=40+rnd("mx"+m.id)*(W-80),y=26+rnd("my"+m.id)*(H*.42);
    const isNewM=bornKey==="ms"+m.id;
    if(isNewM)out+=`<circle class="ring" cx="${x}" cy="${y}" r="4" stroke="#FFF3C9"/>${Array.from({length:8},(_,i)=>{const a=i/8*Math.PI*2;return `<circle class="spark" style="--tx:${(Math.cos(a)*26).toFixed(1)}px;--ty:${(Math.sin(a)*26).toFixed(1)}px" cx="${x}" cy="${y}" r="1.8" fill="#FFF3C9"/>`}).join("")}`;
    out+=`<g class="star ${isNewM?"bloom":""}" data-ms="${m.id}" tabindex="0" role="button" aria-label="Milestone: ${esc(m.title)}"><title>Milestone: ${esc(m.title)}</title>
      <circle cx="${x}" cy="${y}" r="20" fill="transparent"/><circle cx="${x}" cy="${y}" r="12" fill="#F6D98B" opacity=".45" filter="url(#glow)"/>
      ${shapeSVG(msShape,x,y,11*SHAPE_SIZE[msShape]/2.2,"#FFF3C9","tw")}</g>`;
  });
  S.wins.forEach(w=>{
    const x=24+rnd("wx"+w.id)*(W-48),y=18+rnd("wy"+w.id)*(H*.46);
    const isNew=bornKey==="w"+w.id;
    if(isNew)out+=`<circle class="ring" cx="${x}" cy="${y}" r="3" stroke="#FFD3E4"/>${Array.from({length:8},(_,i)=>{const a=i/8*Math.PI*2;return `<circle class="spark" style="--tx:${(Math.cos(a)*26).toFixed(1)}px;--ty:${(Math.sin(a)*26).toFixed(1)}px" cx="${x}" cy="${y}" r="1.8" fill="#FFE3EE"/>`}).join("")}`;
    out+=`<g class="star ${isNew?"bloom":""}" data-win="${w.id}" tabindex="0" role="button" aria-label="Proud moment: ${esc(w.text)}"><title>Proud of: ${esc(w.text)}</title>
      <circle cx="${x}" cy="${y}" r="13" fill="transparent"/>${halo(x,y)}<circle cx="${x}" cy="${y}" r="6" fill="#F7B6CF" opacity=".5" filter="url(#glow)"/>
      ${shapeSVG(winShape,x,y,4.2*SHAPE_SIZE[winShape]/1.6,"#FFD3E4","tw",`animation-delay:-${(rnd("wt"+w.id)*4).toFixed(2)}s`)}</g>`;
  });
  if(shootNext){shootNext=false;const x=W*(.12+Math.random()*.25),y=H*(.06+Math.random()*.12);
    out+=`<defs><linearGradient id="shg" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <g class="shoot" style="--dx:${(W*.55).toFixed(0)}px;--dy:${(H*.32).toFixed(0)}px"><line x1="${x}" y1="${y}" x2="${x-90}" y2="${y-52}" stroke="url(#shg)" stroke-width="2.4" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="2.6" fill="#fff"/></g>`}
  svg.innerHTML=out;bornKey=null;conAnim=null;
}
function headline(){
  const h=new Date().getHours();
  const part=h<5?"Still up":h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  const n=allCompletions().length;
  $("#greet").textContent=part+(S.name?", "+S.name:"")+"."+(n?` ${plural(n,"promise")} kept so far.`:"");
  const hp=isHard()?hardPick():null;
  const [q,who]=hp?HARD_QUOTES[hp.q]||quoteOfDay():quoteOfDay();
  const hl=$("#headline"),nextQ="\u201c"+q+"\u201d";
  if(hl.textContent&&hl.textContent!==nextQ&&!matchMedia("(prefers-reduced-motion: reduce)").matches){hl.parentNode.classList.remove("qfade");void hl.offsetWidth;hl.parentNode.classList.add("qfade")}
  $("#headline").textContent="\u201c"+q+"\u201d";
  $("#attr").textContent=who;
}

/* ---------- pieces ---------- */
function freqFields(f){const dd=f.type==="days"?(f.days||[]):[];return `<div class="freq"><span>How often?</span>
      <select name="ftype" data-freqsel="1" aria-label="How often"><option value="daily" ${f.type==="daily"?"selected":""}>Every day</option><option value="days" ${f.type==="days"?"selected":""}>On certain days</option><option value="weekly" ${f.type==="weekly"?"selected":""}>A number of times a week</option></select>
      <div class="fdays" ${f.type==="days"?"":"hidden"} role="group" aria-label="Which days">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="fday" value="${d}" ${dd.includes(d)?"checked":""}>${DAYS_SHORT[d]}</label>`).join("")}</div>
      <label class="fweekly" ${f.type==="weekly"?"":"hidden"}><input type="number" name="ftimes" min="1" max="7" value="${f.times||3}"> times a week</label></div>`}
function readFreq(form){const F=form.elements,ft=F.ftype.value;
  if(ft==="days"){const days=[...form.querySelectorAll("input[name=fday]:checked")].map(x=>+x.value);return days.length&&days.length<7?{type:"days",days}:{type:"daily"}}
  if(ft==="weekly"){const n=Math.max(1,Math.min(7,parseInt(F.ftimes.value)||3));return n>=7?{type:"daily"}:{type:"weekly",times:n}}
  return {type:"daily"}}
function taskRow(t,{home=false,hard=false}={}){
  const p=P(t.pid),c=p?p.color:"#ccc",on=doneToday(t);
  if(!home&&editingTask===t.id)return `<li class="task" style="--c:${c}"><form class="edit-task" data-form="edittask" data-id="${t.id}">
    <input name="title" required maxlength="140" value="${esc(t.title)}" aria-label="Step">
    <input name="tiny" maxlength="140" value="${esc(t.tiny||"")}" placeholder="Tiny version, e.g. put on running shoes" aria-label="Tiny version">
    <small>The tiny version is the smallest possible form of this step, for low-energy days. It still earns a star.</small>
    ${freqFields(freqOf(t))}
    <div class="row"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" data-act="canceledittask">Cancel</button></div></form></li>`;
  const tinyToday=on&&t.log.some(l=>isToday(l.at)&&l.tiny);

    sub=parts.join(". ");}
  const todayNote=on&&last&&last.note&&noteFor!==t.id&&isToday(last.at)?`<div class="t-sub">\u201c${esc(last.note)}\u201d</div>`:"";
  return `<li class="task ${on?"done":""}" style="--c:${c}" id="task-${t.id}">
    <button class="check ${on?"on":""}" data-act="${hard&&t.tiny&&!on?"tinydone":"toggle"}" data-id="${t.id}" aria-pressed="${on}" aria-label="${on?"Mark not done":"Mark done"}: ${esc(t.title)}">${on?"\u2713":""}</button>
    <div class="t-body"><div class="t-title">${hard&&t.tiny&&!on?esc(t.tiny):esc(t.title)}</div>
      ${hard&&t.tiny&&!on?`<div class="t-sub">The tiny version of “${esc(t.title)}”. That's all.</div>`:sub&&!(home&&on)?`<div class="t-sub">${sub}</div>`:""}
      ${tinyToday?`<div class="t-sub">You did the tiny version. That counts.</div>`:""}${todayNote}
      ${!on&&t.tiny&&!hard?`<button class="tinybtn" data-act="tinydone" data-id="${t.id}">Low energy? Just <b>${esc(t.tiny)}</b></button>`:""}
      ${!home&&!t.tiny&&!on?`<button class="addtiny" data-act="edittask" data-id="${t.id}">+ Add a tiny version</button>`:""}
      ${noteFor===t.id?`<input class="note-in" data-note="${t.id}" value="${esc(last?.note||"")}" placeholder="How did it feel? (optional, press Enter)" aria-label="Note about this">`:""}

    ${on?"":`<button class="sun ${pinned(t)?"on":""}" data-act="pin" data-id="${t.id}" aria-pressed="${pinned(t)}" title="${pinned(t)?"Remove from today":"Add to today"}" aria-label="${pinned(t)?"Remove from today":"Add to today"}">\u2600\ufe0f</button>`}
    ${home?"":`<button class="icon-btn" data-act="edittask" data-id="${t.id}" aria-label="Edit step">\u270e</button><button class="icon-btn" data-act="deltask" data-id="${t.id}" aria-label="Delete step">\u00d7</button>`}

}
function filters(){
  const used=S.categories.filter(c=>S.priorities.some(p=>p.cat===c.id));
  if(used.length<2)return "";
  return `<div class="filters" role="group" aria-label="Filter by category"><button class="filter" data-act="filter" data-id="all" aria-pressed="${filter==="all"}">Everything</button>${used.map(c=>`<button class="filter" data-act="filter" data-id="${c.id}" aria-pressed="${filter===c.id}">${esc(c.name)}</button>`).join("")}</div>`;
}
function showUp(){
  const days=[];for(let i=6;i>=0;i--){const d=Date.now()-i*DAY;days.push({d,k:dayKey(d)})}
  const sd=shownDays(),set=new Set(days.filter(x=>sd.has(dIdx(x.d))).map(x=>x.k));
  const n=days.filter(x=>set.has(x.k)).length,today=set.has(TODAY());
  const msg=today&&isComebackToday()?"You came back today. That is exactly who you are: someone who gets back up."
    :today?(n>=5?`You showed up ${n} of the last 7 days. This is who you are.`:"You showed up today. That's the whole point.")
    :n?`You showed up ${n} of the last 7 days. Today is still open, and one small thing is enough.`
    :"Today is a lovely day to start. One small thing is enough.";
  return `<div class="showup"><p>${msg}</p><div class="week" aria-label="Days you showed up this week">${days.map(x=>`<div class="day ${set.has(x.k)?"on":""} ${x.k===TODAY()?"now":""}"><i></i><span>${new Date(x.d).toLocaleDateString(undefined,{weekday:"narrow"})}</span></div>`).join("")}</div></div>`;

function checkins(){
  const due=S.milestones.filter(dueMs).sort((a,b)=>a.date<b.date?-1:1);
  let h=due.map(m=>`<div class="checkin"><span>${daysUntil(m.date)===0?"Today is the day you set":"The day you set has come"}</span><h3>${esc(m.title)}</h3><p>${m.attempts.length?`Attempt ${m.attempts.length+1}. `:""}How did it go? Either answer is welcome here.</p>
    <div class="row"><button class="btn" data-act="achieve" data-id="${m.id}">I reached it</button><button class="btn ghost" data-act="retry" data-id="${m.id}">Not yet, I'll try again</button></div></div>`).join("");

/* ---------- progress ---------- */
let prog={unit:"week",offset:0};
function range(unit,offset){
  const n=new Date();let a,b;
  if(unit==="day"){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()+offset);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1)}
  else if(unit==="week"){const wd=(n.getDay()+6)%7;a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-wd+offset*7);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7)}
  else if(unit==="month"){a=new Date(n.getFullYear(),n.getMonth()+offset,1);b=new Date(a.getFullYear(),a.getMonth()+1,1)}
  else{a=new Date(n.getFullYear()+offset,0,1);b=new Date(a.getFullYear()+1,0,1)}
  return{a:a.getTime(),b:b.getTime()};
}
function rangeLabel(unit,offset,a){
  const d=new Date(a);
  if(unit==="day")return offset===0?"Today":offset===-1?"Yesterday":d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  if(unit==="week")return offset===0?"This week":offset===-1?"Last week":"Week of "+d.toLocaleDateString(undefined,{day:"numeric",month:"long"});
  if(unit==="month")return d.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  return String(d.getFullYear());
}
function shownDays(){const s=new Set(allCompletions().map(c=>dIdx(c.at)));S.wins.forEach(w=>s.add(dIdx(w.at)));S.rests.forEach(r=>s.add(dIdx(r.at)));return s}
function comebacks(fromI,toI){ // days you showed up after at least one missed day, having shown up before
  const set=shownDays(),sorted=[...set].sort((x,y)=>x-y);
  let n=0,longest=0;
  for(let k=1;k<sorted.length;k++){const gap=sorted[k]-sorted[k-1]-1;if(gap>0&&sorted[k]>=fromI&&sorted[k]<toI){n++;longest=Math.max(longest,gap)}}
  return{n,longest};
}
function isComebackToday(){const set=shownDays(),t=dIdx(Date.now());if(!set.has(t)||set.has(t-1))return false;return [...set].some(i=>i<t-1)}
function countIn(a,b){return allCompletions().filter(c=>c.at>=a&&c.at<b&&P(c.t.pid)).length}
function statStrip(){
  const it=[["day","today"],["week","this week"],["month","this month"],["year","this year"]];
  return `<div class="stats">${it.map(([u,l])=>{const r=range(u,0);return `<button class="stat" data-act="stat" data-id="${u}"><b>${countIn(r.a,r.b)}</b><span>${l}</span></button>`}).join("")}</div>`;
}
function stackCol(items,label,max,now){
  const byP={};items.forEach(c=>{byP[c.t.pid]=(byP[c.t.pid]||0)+1});
  const segs=S.priorities.filter(p=>byP[p.id]).map(p=>`<i style="height:${(byP[p.id]/max*100).toFixed(1)}%;background:${p.color}" title="${esc(p.title)}: ${byP[p.id]}"></i>`).join("");
  return `<div class="bcol ${now?"now":""}"><div class="bstack" title="${items.length}">${segs}</div><span>${label}</span></div>`;
}
function viewProgress(){
  const {unit,offset}=prog, {a,b}=range(unit,offset), now=Date.now();
  const comps=allCompletions().filter(c=>c.at>=a&&c.at<b&&P(c.t.pid));
  const set=shownDays();
  const aI=dIdx(a), bI=dIdx(b), lastI=Math.min(bI,dIdx(now)+1);
  let shown=0,elapsed=Math.max(0,lastI-aI);for(let i=aI;i<lastI;i++)if(set.has(i))shown++;
  let h=`<h2>Progress</h2><p class="lede">Everything you've done, gathered up. This is your evidence.</p>
    <div class="periods" role="group" aria-label="Time span">${[["day","Day"],["week","Week"],["month","Month"],["year","Year"]].map(([u,l])=>`<button data-act="unit" data-id="${u}" aria-pressed="${u===unit}">${l}</button>`).join("")}</div>
    <div class="pnav"><button data-act="shift" data-id="-1" aria-label="Previous">‹</button><h3>${rangeLabel(unit,offset,a)}</h3><button data-act="shift" data-id="1" aria-label="Next" ${offset>=0?"disabled":""}>›</button></div>
    <div class="card"><div class="big"><div><b>${comps.length}</b><span>${comps.length===1?"step kept":"steps kept"}</span></div>${(()=>{const w=S.wins.filter(x=>x.at>=a&&x.at<b).length;return w?`<div><b>${w}</b><span>${w===1?"proud moment":"proud moments"}</span></div>`:""})()}
    ${unit!=="day"?`<div><b>${shown}</b><span>of ${plural(elapsed,"day")} you showed up</span></div>`:""}</div>`;
  // chart
  if(unit==="week"){
    const cols=[];let max=1;
    for(let i=0;i<7;i++){const s=fromIdx(aI+i),e=fromIdx(aI+i+1);const it=comps.filter(c=>c.at>=s&&c.at<e);max=Math.max(max,it.length);cols.push({it,l:new Date(s).toLocaleDateString(undefined,{weekday:"short"}),now:isToday(s)})}
    h+=`<div class="bars">${cols.map(c=>stackCol(c.it,c.l,max,c.now)).join("")}</div>`;
  }else if(unit==="year"){
    const yr=new Date(a).getFullYear();
    if(comps.length)h+=`<div class="row" style="margin:-4px 0 14px"><button class="btn remind-btn" data-act="yearstory" data-id="${yr}">✦ Watch your ${yr} in Proof</button></div>`;
    const cols=[];let max=1;const y=new Date(a).getFullYear();
    for(let m=0;m<12;m++){const s=new Date(y,m,1).getTime(),e=new Date(y,m+1,1).getTime();const it=comps.filter(c=>c.at>=s&&c.at<e);max=Math.max(max,it.length);cols.push({it,l:new Date(s).toLocaleDateString(undefined,{month:"narrow"}),now:s<=now&&now<e})}
    h+=`<div class="bars">${cols.map(c=>stackCol(c.it,c.l,max,c.now)).join("")}</div>`;
  }else if(unit==="month"){
    const counts={};comps.forEach(c=>{const i=dIdx(c.at);counts[i]=(counts[i]||0)+1});
    const max=Math.max(1,...Object.values(counts)), lead=(new Date(a).getDay()+6)%7;
    const hd=[1,2,3,4,5,6,0].map(d=>`<div class="h">${new Date(2024,0,d===0?7:d).toLocaleDateString(undefined,{weekday:"narrow"})}</div>`).join("");
    let cells="";for(let i=0;i<lead;i++)cells+="<div></div>";
    for(let i=aI;i<bI;i++){const n=counts[i]||0,fut=i>dIdx(now);
      cells+=`<div class="c ${n?"on":""} ${i===dIdx(now)?"now":""} ${fut?"fut":""}" style="${n?`background:color-mix(in srgb,var(--accent) ${Math.round(35+65*n/max)}%,var(--soft))`:""}" title="${n} kept">${new Date(fromIdx(i)).getDate()}</div>`}
    h+=`<div class="cal">${hd}${cells}</div>`;
  }else{
    h+=comps.length?`<ul class="tasks">${comps.sort((x,y)=>x.at-y.at).map(c=>{const p=P(c.t.pid);const l=c.t.log.find(x=>x.at===c.at);return `<li class="task done" style="--c:${p.color}"><span class="check on" aria-hidden="true">✓</span><div class="t-body"><div class="t-title">${esc(c.t.title)}</div><div class="t-sub">${l&&l.late?"Added later":new Date(c.at).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}, ${esc(p.title)}${c.tiny?", tiny version":""}${c.note?`. “${esc(c.note)}”`:""}</div></div><button class="unlog" data-act="unlog" data-id="${esc(c.key)}" aria-label="Remove this entry">×</button></li>`}).join("")}</ul>`
      :`<p class="t-sub" style="margin:0">${offset===0?"Nothing checked off yet today. It's still open.":"A quiet day. Rest is part of it too."}</p>`;
    if(offset<0&&S.tasks.some(t=>P(t.pid)))h+=`<form class="backfill" data-form="backfill" data-day="${aI}"><strong>Forgot to log something from this day?</strong><div class="row">
      <select name="tid" aria-label="Which step">${S.priorities.map(p=>{const ts=S.tasks.filter(t=>t.pid===p.id);return ts.length?`<optgroup label="${esc(p.title)}">${ts.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join("")}</optgroup>`:""}).join("")}</select>
      <input name="note" maxlength="200" placeholder="Note (optional)" aria-label="Note"><button class="btn quiet" type="submit">Add to this day</button></div></form>`;
  }
  h+=`</div>`;
  // breakdown
  if(comps.length){
    const byP={};comps.forEach(c=>{byP[c.t.pid]=(byP[c.t.pid]||0)+1});
    const max=Math.max(...Object.values(byP));
    const groups=[...S.categories.map(c=>({name:c.name,ps:S.priorities.filter(p=>p.cat===c.id)})),{name:"No category",ps:S.priorities.filter(p=>!p.cat||!C(p.cat))}]
      .map(g=>({...g,ps:g.ps.filter(p=>byP[p.id]),n:g.ps.reduce((s,p)=>s+(byP[p.id]||0),0)})).filter(g=>g.n).sort((x,y)=>y.n-x.n);
    h+=`<div class="card"><strong>Where your energy went</strong><ul class="brk" style="margin-top:8px">${groups.map(g=>`<li><span>${esc(g.name)}</span><b>${g.n}</b></li>`+g.ps.sort((x,y)=>byP[y.id]-byP[x.id]).map(p=>`<li class="sub" style="--c:${p.color}"><span class="t-sub" style="color:var(--ink)">${esc(p.title)}</span><span class="t-sub">${byP[p.id]}</span><div class="bar"><i style="width:${(byP[p.id]/max*100).toFixed(0)}%"></i></div></li>`).join("")).join("")}</ul></div>`;
  }
  // resilience
  const all=comebacks(-1e9,1e9), here=unit==="day"?null:comebacks(aI,bI), total=set.size;
  let title,body;
  if(!total){title="This is where your comebacks will be counted.";body="Every time you step away and return, it shows up here. Coming back is the whole skill."}
  else if(!all.n){title="You haven't needed to come back yet.";body="Some days you'll miss. That's human. When you return, it gets counted here, because returning is proof too."}
  else{title=`You've gotten back up ${plural(all.n,"time")}.`;body=`Every single time you stepped away, you came back.${all.longest>1?` The longest you were away was ${all.longest} days, and you still returned.`:""} That's not someone who gives up on themselves.`}
  h+=`<div class="rise"><h3>${title}</h3><p>${body}</p><div class="nums">
    <div><b>${total}</b><span>days you've shown up</span></div>
    <div><b>${all.n}</b><span>comebacks, all time</span></div>
    ${S.milestones.length?`<div><b>${S.milestones.filter(m=>m.status==="achieved").length}</b><span>milestones reached</span></div><div><b>${S.milestones.reduce((s,m)=>s+m.attempts.filter(a=>a.outcome==="retry").length,0)}</b><span>times you re-aimed instead of quitting</span></div>`:""}
    ${here?`<div><b>${here.n}</b><span>comebacks ${rangeLabel(unit,offset,a).toLowerCase().startsWith("this")||rangeLabel(unit,offset,a).startsWith("Last")?rangeLabel(unit,offset,a).toLowerCase():"in "+rangeLabel(unit,offset,a)}</span></div>`:""}
  </div></div>`;
  return h;
}


/* ---------- views ---------- */
function viewHome(){
  if(!S.priorities.length)return `<h2>Welcome</h2><p class="lede">Start with what matters to you. Each priority holds a belief about who you are and the small steps that prove it.</p><div class="empty"><p>Your home page will fill up with your routines, the things you usually do, and the priorities you're living by.</p><button class="btn" data-act="goto" data-tab="priorities">Add your first priority</button></div>`;
  if(isHard())return `<h2>Today</h2>`+hardHome();
  const pool=S.tasks.filter(t=>inFilter(t)&&P(t.pid));
  const doneNow=pool.filter(t=>t.log.some(l=>isToday(l.at)));
  const cand=pool.filter(t=>isOpen(t)&&!doneToday(t)).map(t=>({t,s:score(t)})).sort((a,b)=>b.s-a.s);
  const main=cand.filter(x=>x.s>0).slice(0,8).map(x=>x.t);
  const more=cand.filter(x=>!main.includes(x.t)).map(x=>x.t);
  const list=[...main,...doneNow];
  const total=list.length, done=doneNow.length, pct=total?Math.round(done/total*100):0;

    <div class="hard-link"><button class="btn remind-btn" data-act="remind">✦ Remind me</button><button class="btn quiet" data-act="win">I'm proud of…</button><button class="btn ghost" data-act="hardon">Having a hard day?</button><button class="btn ghost" data-act="yesterday">Log a past day</button></div>
    ${yearCard()}${pastNoteAsk()}${onThisDay()}${statStrip()}${filters()}`;
  if(!list.length&&!more.length){
    h+=`<div class="empty"><p>No steps here yet. Add a few things you usually do under your priorities, marked as regular, and they'll show up here every day.</p><button class="btn quiet" data-act="goto" data-tab="priorities">Add steps</button></div>`;
  }else{
    h+=`<div class="today-card">${total?`<div class="list-head"><strong>${done?`${plural(done,"thing")} done today`:"Your list for today"}</strong><span>${done} of ${total}</span></div><div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>`:""}
      <ul class="tasks">${list.map(t=>taskRow(t,{home:true})).join("")}</ul>
      ${more.length?`<details class="more"><summary>${plural(more.length,"more thing")} you could do</summary><ul class="tasks">${more.map(t=>taskRow(t,{home:true})).join("")}</ul></details>`:""}
    </div>`;
  }
  const ps=S.priorities.filter(p=>filter==="all"||p.cat===filter);
  h+=`<h3 class="sec">Your priorities</h3><div class="pgrid">${ps.map(p=>{
    const comps=S.tasks.filter(t=>t.pid===p.id).flatMap(t=>t.log);
    const td=comps.filter(l=>isToday(l.at)).length, wk=comps.filter(l=>Date.now()-l.at<7*DAY).length;
    return `<button class="pcard" style="--c:${p.color}" data-act="openp" data-id="${p.id}"><b><i></i>${esc(p.title)}</b>${p.belief?`<small>I am someone who ${esc(p.belief)}</small>`:""}<em>${td?`${plural(td,"star")} today`:wk?`${plural(wk,"star")} this week`:"Waiting for you, no rush"}</em></button>`}).join("")}</div>`;
  return h;
}

function viewPriorities(){
  let h=`<h2>Priorities</h2><p class="lede">What you care about, the person you believe you are, and the steps that prove it. Every step resets each morning, so each day is a fresh chance to show up. Nothing you did yesterday is lost; it lives in your sky and your progress.</p>`;
  const groups=[...S.categories.map(c=>({c,ps:S.priorities.filter(p=>p.cat===c.id)})),{c:null,ps:S.priorities.filter(p=>!p.cat||!C(p.cat))}].filter(g=>g.ps.length);

    h+=S.wins.length?`<div class="card"><ul class="wins-list">${[...S.wins].reverse().map(w=>`<li><small>${fmtDate(w.at)}${P(w.pid)?`, ${esc(P(w.pid).title)}`:""}</small>${esc(w.text)} <button class="icon-btn" data-act="delwin" data-id="${w.id}" aria-label="Remove">\u00d7</button></li>`).join("")}</ul></div>`
      :`<div class="empty"><p>Nothing here yet. Setting a boundary, being patient, getting out of bed on a heavy day: it all counts.</p></div>`;
  }else if(reflectSec==="sunday"){
    h+=rc.length?`<div class="card"><ul class="wins-list">${rc.map(([k,v])=>`<li><small>Week of ${fmtYmd(k)}: ${esc(v.q)}</small>${esc(v.answer)}</li>`).join("")}</ul></div>`

  }
  return h;
}


/* ---------- milestones ---------- */
function msForm(m){

function whenText(m){
  const d=daysUntil(m.date);
  if(d>1)return `In ${d} days, ${fmtYmd(m.date)}`;
  if(d===1)return "Tomorrow";
  if(d===0)return "Today's the day";
  return `Check in: the date was ${fmtYmd(m.date)}`;
}
function msCard(m){
  if(msEditing===m.id)return msForm(m);
  const p=P(m.pid),c=p?p.color:"#F6D98B",won=m.status==="achieved";
  const retries=m.attempts.filter(a=>a.outcome==="retry");
  const hist=retries.map(a=>`<li>Aimed for ${fmtYmd(a.due)}, then got back in the saddle${a.note?`. \u201c${esc(a.note)}\u201d`:"."}</li>`).join("")+(won?`<li class="win">Reached on ${fmtDate(m.achievedAt)}.</li>`:"");
  let h=`<article class="ms ${won?"won":""}" style="--c:${c}">
    <div class="ms-top"><span class="ms-when">${won?"Reached":esc(whenText(m))}</span>${!won&&retries.length?`<span class="pill">Attempt ${retries.length+1}</span>`:""}${p?`<span class="pill">${esc(p.title)}</span>`:""}</div>
    <h3>${esc(m.title)}</h3>${m.why?`<p class="why">${esc(m.why)}</p>`:""}
    ${won?`<p>${retries.length?`It took ${plural(retries.length+1,"attempt")}. You never stopped trying.`:"You said you would, and you did."}</p>`:""}
    ${hist?`<ul class="ms-hist">${hist}</ul>`:""}`;
  if(!won){
    if(retryFor===m.id){
      h+=`<form class="retry" data-form="retry" data-id="${m.id}"><p>Not yet is not never. Everything you did on the way still counts. Let's choose a new date.</p>
        <label class="field"><span>New date</span><input type="date" name="date" required value="${ymd(Math.max(Date.now(),parseYmd(m.date))+14*DAY)}"></label>
        <label class="field"><span>What will you carry into the next try? (optional)</span><input name="note" maxlength="200" placeholder="Smaller steps, more rest, asking for help…"></label>
        <div class="row"><button class="btn" type="submit">Get back in the saddle</button><button class="btn ghost" type="button" data-act="cancelretry">Cancel</button></div></form>`;
    }else{
      h+=`<div class="row"><button class="btn" data-act="achieve" data-id="${m.id}">I reached it</button>
        ${dueMs(m)?`<button class="btn quiet" data-act="retry" data-id="${m.id}">Not yet, I'll try again</button>`:`<button class="btn ghost" data-act="retry" data-id="${m.id}">Change the date</button>`}

const RECAP_Q=["What's one moment from this week you want to remember?","What was hard this week, and how did you get through it?","Where were you kinder to yourself than you used to be?","What's one tiny thing you'd like to carry into next week?","Who or what helped you this week?","What surprised you about yourself this week?","What would you tell yourself from the start of this week?"];

/* ---------- evidence (shared by Remind Me and Year in Proof) ---------- */
function evidenceCtx(fromI=-1e9,toI=1e9){
  const comps=allCompletions().filter(c=>P(c.t.pid)&&dIdx(c.at)>=fromI&&dIdx(c.at)<toI).sort((a,b)=>a.at-b.at);
  const all=shownDays(),days=[...all].filter(i=>i>=fromI&&i<toI).sort((a,b)=>a-b),today=dIdx(Date.now());
  const byTask={},byP={};comps.forEach(c=>{byTask[c.t.id]=(byTask[c.t.id]||0)+1;byP[c.t.pid]=(byP[c.t.pid]||0)+1});
  const gaps=[];for(let k=1;k<days.length;k++){const g=days[k]-days[k-1]-1;if(g>0)gaps.push({g,ret:fromIdx(days[k])})}
  const longest=gaps.reduce((m,x)=>x.g>(m?m.g:0)?x:m,null);
  const inR=t=>dIdx(t)>=fromI&&dIdx(t)<toI;
  return {comps,total:comps.length,days,today,daysSinceLast:days.length?today-days[days.length-1]:null,gaps,longest,comebacks:gaps.length,
    byTask:Object.entries(byTask).map(([id,n])=>({t:T(id),n})).filter(x=>x.t).sort((a,b)=>b.n-a.n),
    byP:Object.entries(byP).map(([id,n])=>({p:P(id),n})).filter(x=>x.p).sort((a,b)=>b.n-a.n),
    notes:comps.filter(c=>c.note&&!isToday(c.at)),tiny:comps.filter(c=>c.tiny),
    wins:S.wins.filter(w=>inR(w.at)),rests:S.rests.filter(r=>inR(r.at)),
    msWon:S.milestones.filter(m=>m.status==="achieved"&&m.achievedAt&&inR(m.achievedAt)),
    retries:S.milestones.reduce((n,m)=>n+m.attempts.filter(a=>a.outcome==="retry"&&inR(a.at)).length,0),
    proved:S.checkpoints.filter(c=>c.proved&&inR(c.date)),
    first:comps[0]||null};
}
const pickOne=a=>a.length?a[Math.floor(Math.random()*a.length)]:null;
const times=n=>n===1?"once":n===2?"twice":n+" times";
function storyPhotos(){
  if(!(S.settings&&S.settings.storyPhotos))return null;
